<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>阿牧展厅｜空间框架</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
    <style>
      html, body, #panorama { height: 100%; margin: 0; background: #101318; }
      .pnlm-panorama-info { top: 18px; right: 18px; bottom: auto; left: auto; border-radius: 3px; }
      .scene-nav { position: fixed; right: 18px; bottom: 18px; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px; max-width: 420px; }
      .scene-nav button { border: 1px solid rgba(255,255,255,.24); border-radius: 999px; background: rgba(15,18,24,.76); color: #fff; cursor: pointer; padding: 9px 13px; font: 14px/1 system-ui, sans-serif; }
      .scene-nav button:hover, .scene-nav button[aria-current="true"] { background: #fff; color: #111; }
    </style>
  </head>
  <body>
    <div id="panorama"></div>
    <nav class="scene-nav" aria-label="展厅点位切换">
      <button type="button" data-scene="a-wall">A区</button>
      <button type="button" data-scene="b-wall">B区</button>
      <button type="button" data-scene="c-wall">C区</button>
      <button type="button" data-scene="d-office">D区</button>
      <button type="button" data-scene="e-foyer">E区</button>
    </nav>
    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script src="scenes.js"></script>
  </body>
</html>
